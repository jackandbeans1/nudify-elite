<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>nudify · elite</title>
<style>
:root{--bg:#0b0d12;--panel:#141821;--line:#232a38;--fg:#e7ecf5;--mut:#8b95a7;--acc:#7c5cff}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 ui-sans-serif,system-ui,Segoe UI,Roboto;background:var(--bg);color:var(--fg)}
header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline}
header span{color:var(--mut)}
main{display:grid;grid-template-columns:380px 1fr;gap:18px;padding:22px;max-width:1250px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;color:var(--mut);font-size:12px;margin:10px 0 4px}
textarea,input,select{width:100%;background:#0e121a;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:9px;font:inherit}
textarea{resize:vertical}.row{display:flex;gap:10px}.row>*{flex:1}
button{width:100%;margin-top:14px;padding:11px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:progress}
#drop{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--mut);cursor:pointer}
#drop.hot{border-color:var(--acc);color:var(--fg)}
img{max-width:100%;border-radius:12px;display:block}
.out{min-height:320px;display:flex;align-items:center;justify-content:center;color:var(--mut);flex-direction:column;gap:12px}
.bar{width:100%;height:10px;background:#0e121a;border:1px solid var(--line);border-radius:99px;overflow:hidden;display:none}
.bar.on{display:block}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5a3bff,#7c5cff,#b18cff);transition:width .25s ease}
.barTxt{font-size:12px;color:var(--mut);display:none}.barTxt.on{display:block}
pre{white-space:pre-wrap;text-align:left;font-size:12px;color:#ff9a9a}
</style></head>
<body>
<header><b>nudify</b><span>elite · backends</span></header>
<main>
<section class="panel">
<div id="drop">drop a photo here<br><small>or click to choose</small></div>
<input id="file" type="file" accept="image/*" hidden>
<label>backend</label>
<select id="backend"></select>
<label>prompt</label>
<textarea id="prompt" rows="3">bare skin, natural body, photorealistic, soft light, detailed skin</textarea>
<label>negative</label>
<textarea id="negative" rows="2">clothes, fabric, lowres, blurry, deformed, bad anatomy, extra limbs, watermark</textarea>
<label>loras (path_or_repo:weight, ...)</label>
<input id="loras" type="text" value="">
<div class="row">
<div><label>steps (0=auto)</label><input id="steps" type="number" value="0" min="0" max="60"></div>
<div><label>guidance (0=auto)</label><input id="guidance" type="number" value="0" step="0.5" min="0" max="20"></div>
<div><label>seed</label><input id="seed" type="number" value="-1"></div>
</div>
<button id="go" disabled>Generate</button>
<div class="bar" id="bar"><i id="fill"></i></div>
<div class="barTxt" id="barTxt"></div>
</section>
<section class="panel out" id="out"><span>result appears here</span></section>
</main>
<script>
const q = s => document.querySelector(s);
let src = null;
const drop = q('#drop'), file = q('#file');
drop.onclick = () => file.click();
file.onchange = e => load(e.target.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('hot'); };
drop.ondragleave = () => drop.classList.remove('hot');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('hot'); load(e.dataTransfer.files[0]); };
function load(f){ if(!f) return; src=f; drop.innerHTML = `<img src="${URL.createObjectURL(f)}">`; q('#go').disabled=false; }
function bar(v,t){ q('#bar').classList.add('on'); q('#barTxt').classList.add('on'); q('#fill').style.width=Math.round(v*100)+'%'; q('#barTxt').textContent=t; }
(async () => {
  const list = await (await fetch('/backends')).json();
  const sel = q('#backend');
  list.forEach(b => {
    const o = document.createElement('option');
    o.value = b.id;
    o.textContent = b.label + (b.model ? '' : '  (no model set)');
    sel.appendChild(o);
  });
})();
q('#go').onclick = async () => {
  if(!src) return; q('#go').disabled=true;
  const out = q('#out'); out.innerHTML='<span>starting…</span>'; bar(0,'0%');
  const fd = new FormData();
  fd.append('file', src);
  fd.append('prompt', q('#prompt').value);
  fd.append('negative', q('#negative').value);
  fd.append('backend', q('#backend').value);
  fd.append('loras', q('#loras').value);
  fd.append('steps', q('#steps').value);
  fd.append('guidance', q('#guidance').value);
  fd.append('seed', q('#seed').value);
  let job_id;
  try { job_id = (await (await fetch('/nudify',{method:'POST',body:fd})).json()).job_id; }
  catch(e){ out.innerHTML='<pre>'+e.message+'</pre>'; q('#go').disabled=false; return; }
  const es = new EventSource('/progress/' + job_id);
  es.onmessage = async ev => {
    const s = JSON.parse(ev.data);
    if (s.status==='queued') bar(s.progress,'queued…');
    else if (s.status==='running') bar(s.progress, Math.round(s.progress*100)+'%  ·  generating');
    else if (s.status==='done'){
      bar(1,'100%  ·  done'); es.close();
      const u = URL.createObjectURL(await (await fetch('/result/'+job_id)).blob());
      out.innerHTML = `<img src="${u}"><a href="${u}" download="nudify.png" style="color:var(--acc)">download</a>`;
      q('#go').disabled=false;
    } else if (s.status==='error'){ es.close(); out.innerHTML='<pre>'+(s.error||'error')+'</pre>'; q('#go').disabled=false; }
  };
  es.onerror = () => { es.close(); out.innerHTML='<pre>connection lost</pre>'; q('#go').disabled=false; };
};
</script>
</body></html>
